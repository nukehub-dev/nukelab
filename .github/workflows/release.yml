name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No curated CHANGELOG.md section found for $VERSION — see the commit log." > release-notes.md
          fi
          {
            echo ""
            echo "## Container images"
            echo ""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-backend:${VERSION}\""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-frontend:${VERSION}\""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-auth-sidecar:${VERSION}\""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-base:${VERSION}\""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-conda-base:${VERSION}\""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-workspace:${VERSION}\""
            echo "- \"ghcr.io/${{ github.repository_owner }}/nukelab-dev:${VERSION}\""
          } >> release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
