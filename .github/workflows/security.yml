name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Sundays at 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTAINER_ENGINE: docker

jobs:
  changes:
    name: Detect security changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect security-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Expensive scans run only for changes that can affect the
            # application images or the security tooling itself.
            code:
              - 'backend/**'
              - 'frontend/**'
              - 'services/**'
              - 'environments/**'
              - 'resources/**'
              - 'compose*.yml'
              - 'scripts/**'
              - 'infrastructure/**'
              - '.dockerignore'
              - 'VERSION'
              - 'nukelabctl'
              - '.github/workflows/security.yml'

  dependency-and-sast-scans:
    name: Dependency / SAST / SBOM
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run NukeLab security scans
        run: |
          cp .env.example .env.development
          ./nukelabctl security --with-dev
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: backend/reports/security/
          retention-days: 30

  container-image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: [changes, dependency-and-sast-scans]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    env:
      CONTAINER_ENGINE: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up environment
        run: |
          cp .env.example .env.development

      - name: Build core images
        run: ./nukelabctl build all

      - name: Build volume helper image
        run: |
          $CONTAINER_ENGINE build \
            --file services/volume-helper/Dockerfile \
            --tag nukelab-volume-helper:latest \
            .

      - name: Run Trivy image scans
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          # compose.yml tags locally built images with the ghcr.io name.
          image-ref: 'ghcr.io/nukehub-dev/nukelab-backend:latest'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy image scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: 'ghcr.io/nukehub-dev/nukelab-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy image scan (volume helper)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: 'nukelab-volume-helper:latest'
          format: 'sarif'
          output: 'trivy-volume-helper.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Merge SARIF files
        id: merge
        run: |
          python3 -c "
          import json, glob, os
          runs = []
          for f in glob.glob('trivy-*.sarif'):
              if f == 'trivy-merged.sarif':
                  continue
              runs.extend(json.load(open(f)).get('runs', []))
          if not runs:
              merged = {'\$schema': 'https://json.schemastore.org/sarif-2.1.0.json', 'version': '2.1.0', 'runs': []}
          else:
              merged = {'\$schema': 'https://json.schemastore.org/sarif-2.1.0.json', 'version': '2.1.0', 'runs': [{
                  'tool': runs[0]['tool'],
                  'results': [],
              }]}
              for run in runs:
                  merged['runs'][0]['results'].extend(run.get('results', []))
          json.dump(merged, open('trivy-merged.sarif', 'w'), indent=2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('runs=%d\n' % len(merged['runs']))
          "

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        # The code-scanning API rejects a SARIF payload with zero runs
        # ("1 item required; only 0 were supplied") — skip the upload when
        # every scan failed to produce a report instead of failing the job.
        if: always() && steps.merge.outputs.runs != '0'
        with:
          sarif_file: trivy-merged.sarif

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # PR: scan from the PR base commit to the PR head commit.
          # Push: scan the just-pushed range (before..after).
          # Schedule / manual dispatch: scan the full history (empty base).
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.event.pull_request.head.sha || github.event.after || 'HEAD' }}
          # Lob is excluded: its test_-key pattern false-positives on Python
          # test function names, and NukeLab never uses the Lob API.
          extra_args: --debug --only-verified --exclude-detectors=Lob

  signed-commits-check:
    name: Signed Commits Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for unsigned commits
        run: |
          cp .env.example .env.development
          ./nukelabctl security --signed-commits --no-bandit --no-pip-audit --no-npm-audit --no-trivy
        continue-on-error: true

      - name: Remediation notice
        if: failure()
        run: |
          echo "::warning::Branch contains unsigned commits. Enable branch protection"
          echo "::warning::requiring signed commits and configure team GPG/SSH signing."

  base-image-pinning:
    name: Base Image Pinning
    runs-on: ubuntu-latest
    # Enforced: every external Dockerfile base image must be digest-pinned.
    # Deliberately not path-filtered and not continue-on-error, so Security
    # Gate blocks an unpinned FROM instead of only reporting it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify base images are pinned by digest
        run: |
          cp .env.example .env.development
          ./nukelabctl security --check-base-images --no-bandit --no-pip-audit --no-npm-audit --no-trivy

  base-image-digest-review:
    name: Base Image Digest Review
    runs-on: ubuntu-latest
    # Weekly and manual review only. This is intentionally not a PR gate: the
    # strict Base Image Pinning job above remains the blocking check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: base-image-digest-review
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Optional read-only Docker Hub credentials avoid anonymous manifest
      # rate limits. Set repository variable DOCKERHUB_USERNAME and secret
      # DOCKERHUB_TOKEN to enable; the token is never echoed.
      - name: Authenticate to Docker Hub (optional)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "No Docker Hub credentials configured; resolving anonymously."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Verify Docker Buildx availability
        run: docker buildx version

      - name: Resolve pinned base-image tags
        id: drift
        shell: bash
        run: |
          set +e
          ./scripts/security/check-base-image-drift.sh --platform linux/amd64 > base-image-drift.txt 2>&1
          status=$?
          set -e
          cat base-image-drift.txt
          case "$status" in
            0|1|2) ;;
            *)
              echo "Unexpected checker exit code: $status" >&2
              exit 2
              ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Create or update drift tracking issue
        id: issue
        if: steps.drift.outputs.status == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[supply-chain] Base image digest drift'
          body_file="${RUNNER_TEMP}/base-image-digest-drift-issue.md"
          {
            echo "## Base image digest drift detected"
            echo
            echo "- Detected: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Workflow run: ${RUN_URL}"
            echo "- Platform reviewed: \`linux/amd64\`"
            echo "- Scope: tracked Dockerfile \`FROM\` references only (tool images and GitHub Actions refs are out of scope)."
            echo
            echo '```text'
            head -c 50000 base-image-drift.txt
            if [ "$(wc -c < base-image-drift.txt)" -gt 50000 ]; then
              echo
              echo "... output truncated at 50000 bytes ..."
            fi
            echo '```'
            echo
            echo "### Remediation"
            echo
            echo "1. Confirm the current digest is the intended upstream artifact (review the registry and tag release notes)."
            echo "2. Update each \`FROM image:tag@sha256:...\` listed above to the current digest."
            echo "3. Run \`./nukelabctl security --check-base-images\` and rebuild the affected images."
            echo "4. Open a normal pull request for review. This workflow never opens or updates a PR."
            echo
            echo "_This issue is maintained automatically by the scheduled Base Image Digest Review workflow._"
          } > "$body_file"

          existing="$(gh issue list --state open --search 'Base image digest drift in:title' --limit 100 --json number,title,url)"
          number="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .number' <<< "$existing" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body_file" > /dev/null
            url="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .url' <<< "$existing" | head -n 1)"
            echo "Updated existing drift issue #${number}"
          else
            label_args=()
            if gh label create supply-chain --color BFD4F2 --description 'Scheduled supply-chain review' > /dev/null 2>&1 \
              || gh label list --limit 100 --json name --jq '.[] | select(.name == "supply-chain") | .name' | grep -qx supply-chain; then
              label_args=(--label supply-chain)
            fi
            url="$(gh issue create --title "$title" --body-file "$body_file" "${label_args[@]}")"
            number="${url##*/}"
            echo "Created drift issue #${number}"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Close resolved drift issue
        if: steps.drift.outputs.status == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[supply-chain] Base image digest drift'
          existing="$(gh issue list --state open --search 'Base image digest drift in:title' --limit 100 --json number,title,url)"
          number="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .number' <<< "$existing" | head -n 1)"
          if [ -z "$number" ]; then
            echo "No open drift issue to close."
            exit 0
          fi
          gh issue close "$number" --reason completed \
            --comment "No base-image digest drift was detected on $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Run: ${RUN_URL}"
          echo "Closed resolved drift issue #${number}"

      - name: Fail on resolution error
        if: steps.drift.outputs.status == '2'
        run: |
          echo "::error::Base-image digest resolution failed; see the checker output above. No issue was opened, updated, or closed."
          exit 1

      - name: Fail on drift
        if: steps.drift.outputs.status == '1'
        run: |
          echo "::error::Base image digest drift detected; tracking issue: ${{ steps.issue.outputs.url }}"
          exit 1

      - name: Publish checker output to job summary
        if: always()
        shell: bash
        run: |
          if [ -f base-image-drift.txt ]; then
            {
              echo '### Base image digest review'
              echo '```text'
              cat base-image-drift.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    # Always run so branch protection can require a stable, non-matrix check
    # even when path-scoped scans are skipped or an upstream job fails.
    # Keep this list in sync with every pull-request-enforced job; the
    # scheduled-only Base Image Digest Review is intentionally excluded.
    if: always()
    needs:
      - changes
      - dependency-and-sast-scans
      - container-image-scan
      - secret-scan
      - signed-commits-check
      - base-image-pinning
    permissions:
      contents: read
    steps:
      - name: Verify required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          accepted = {"success", "skipped"}
          rejected = {
              name: job.get("result")
              for name, job in needs.items()
              if job.get("result") not in accepted
          }

          for name in sorted(needs):
              print(f"{name}: {needs[name].get('result')}")

          if rejected:
              details = ", ".join(
                  f"{name}={result}" for name, result in sorted(rejected.items())
              )
              print(
                  "Required security jobs failed, were cancelled, or returned "
                  f"an unexpected result: {details}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("All required security job results are success or skipped.")
          print(
              "Note: Base Image Pinning is enforcing. The scan steps in "
              "Dependency/SAST, Container Image Scan, and Signed Commits "
              "Check remain advisory while continue-on-error is set."
          )
          PY
