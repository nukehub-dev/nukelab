# Protected static fixture served behind the real auth sidecar. Mirrors the
# auth_request shape of environments/dev/terminal.conf without requiring a
# second process.
location / {
    auth_request /auth;
    auth_request_set $auth_user $upstream_http_x_user_id;
    auth_request_set $auth_server $upstream_http_x_server_id;

    root /usr/share/nginx/html/fixture;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-NukeLab-E2E-Fixture "runtime" always;
}
